name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build || true

      - name: Test
        run: npm test || true

  publish:
    name: Version & Publish to npm
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore: bump version to')
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install

      - name: Configure git
        run: |
          git config user.name "Mehedi Hasan"
          git config user.email "mehedinaeem66@gmail.com"

      - name: Bump patch version
        run: |
          npm version patch -m "chore: bump version to %s"

      - name: Push version bump
        run: git push origin main

      - name: Build
        run: |
          node ./node_modules/typescript/bin/tsc --project tsconfig.build.json || true
          node ./node_modules/rollup/dist/bin/rollup -c rollup.config.js
          node ./node_modules/terser/bin/terser dist/amarwave.umd.js -o dist/amarwave.min.js --compress --mangle --source-map

      - name: Publish to npm
        run: npm publish --provenance --access public
