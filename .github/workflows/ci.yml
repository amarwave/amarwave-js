name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build || true

      - name: Test
        run: npm test || true

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install

      - name: Check if version is already published
        id: check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view amarwave-js@${PKG_VERSION} version 2>/dev/null || echo "")
          if [ "$PUBLISHED" = "$PKG_VERSION" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Build
        if: steps.check.outputs.skip == 'false'
        run: |
          node ./node_modules/typescript/bin/tsc --project tsconfig.build.json || true
          node ./node_modules/rollup/dist/bin/rollup -c rollup.config.js
          node ./node_modules/terser/bin/terser dist/amarwave.umd.js -o dist/amarwave.min.js --compress --mangle --source-map

      - name: Publish
        if: steps.check.outputs.skip == 'false'
        run: npm publish --provenance --access public
